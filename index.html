<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Signal</title>
  <meta name="theme-color" content="#E8E5D9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --paper: #E8E5D9;
      --paper-raised: #F1EEE3;
      --ink: #22261F;
      --ink-soft: #52564C;
      --ink-faint: #8B8C7F;
      --rule: #B9B6A5;
      --rule-strong: #22261F;
      --signal-gold: #B8842E;
      --signal-dim: #D9C7A0;
      --teal: #2F4F49;
      --teal-bg: #DDE3DE;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      line-height: 1.65;
      padding: 1.5rem 1.25rem 6rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Masthead Header */
    .masthead-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    #issue-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .mode-toggle-btn {
      background: transparent;
      border: 1px solid var(--rule);
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--ink);
      cursor: pointer;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    h1.title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(3rem, 11vw, 4.4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      text-align: center;
      line-height: 0.95;
      color: var(--ink);
      margin: 0.5rem 0 0.4rem;
    }

    .tagline {
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 1.5rem;
    }

    .rule-thick {
      border: none;
      border-top: 3px solid var(--rule-strong);
      margin: 0 0 0.5rem;
    }

    /* Track Tabs Bar */
    .tabs-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--rule-strong);
      margin-bottom: 2rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      gap: 0;
      width: 100%;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: none;
      border: none;
      padding: 0.75rem 1.1rem;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -1px;
      flex-shrink: 0;
    }
    .tab-btn .count {
      color: var(--ink-faint);
      margin-left: 5px;
      font-size: 10px;
    }
    .tab-btn.active {
      color: var(--ink);
      font-weight: 700;
      border-bottom: 2.5px solid var(--signal-gold);
    }

    /* Article Card Item */
    .article-item {
      padding: 1.75rem 0;
      border-top: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .article-item:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    /* Top Meta Line */
    .article-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.2rem;
    }

    .source-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
      font-weight: 500;
    }

    .date-label {
      color: var(--ink-soft);
    }

    .mark-read-btn {
      background: none;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
      cursor: pointer;
      margin-left: auto;
      text-decoration: underline;
      text-underline-offset: 2px;
      white-space: nowrap;
      padding: 0;
    }
    .mark-read-btn:hover { color: var(--ink); }

    /* Headline */
    .article-headline {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(1.45rem, 5.2vw, 1.95rem);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -0.015em;
      color: var(--ink);
      text-decoration: none;
    }
    .article-headline:hover {
      color: var(--signal-gold);
    }

    /* Summary & Clamp */
    .article-body-wrap {
      position: relative;
    }
    .article-body {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-item.expanded .article-body {
      display: block;
      -webkit-line-clamp: unset;
    }

    .read-more-btn {
      background: none;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      color: var(--signal-gold);
      cursor: pointer;
      padding: 6px 0 0;
      display: inline-block;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Deep Dive Box */
    .deep-dive-box {
      margin-top: 0.4rem;
      padding: 0.85rem 1.1rem;
      background: var(--teal-bg);
      border-left: 3.5px solid var(--teal);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--teal);
      line-height: 1.6;
    }
    .deep-dive-box strong {
      color: var(--teal);
      font-weight: 700;
    }

    /* Source Outbound Link */
    .read-source-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      color: var(--signal-gold);
      text-decoration: none;
      border-bottom: 1px solid var(--signal-dim);
      padding-bottom: 1px;
      margin-top: 0.4rem;
      width: fit-content;
    }
    .read-source-link:hover {
      border-bottom-color: var(--signal-gold);
    }

    /* Signal meter bar */
    .signal-meter {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .signal-meter .bar { width: 3px; background: var(--rule); border-radius: 1px; }
    .signal-meter .bar:nth-child(1) { height: 4px; }
    .signal-meter .bar:nth-child(2) { height: 6px; }
    .signal-meter .bar:nth-child(3) { height: 8px; }
    .signal-meter .bar:nth-child(4) { height: 10px; }
    .signal-meter .bar:nth-child(5) { height: 12px; }
    .signal-meter .bar.on { background: var(--signal-gold); }

    #loading, #empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--ink-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="masthead-top">
      <span id="issue-date">TUESDAY, AUGUST 25, 2026</span>
      <button class="mode-toggle-btn" id="mode-btn" onclick="toggleBento()" title="Toggle Mode">💻</button>
    </div>
    <h1 class="title">The Signal</h1>
    <div class="tagline">ENGINEERING, FILTERED. NO NOISE, JUST WHAT MOVED.</div>
  </header>
  
  <hr class="rule-thick">

  <div class="tabs-bar" id="tabs-bar"></div>

  <div id="loading">Loading today's issue…</div>
  <div id="empty" style="display:none;">Nothing cleared the signal threshold in this track today.</div>

  <main id="content"></main>
</div>

<script>
  const SUPABASE_URL = 'https://srfhubczkyqgryphkpfb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WNpgnNEFi329sp-lnqRPdg_huw4yojT';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let ALL_ARTICLES = [];
  let activeTrack = "All";
  let archivedSignals = JSON.parse(localStorage.getItem('the_signal_archived_ids') || '[]');

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return 'TUESDAY, AUGUST 25, 2026';
    const d = new Date(dateStr.includes('T') ? dateStr : dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
  }

  function signalMeter(score) {
    let bars = '';
    for (let i = 1; i <= 5; i++) {
      bars += `<span class="bar ${i <= score ? 'on' : ''}"></span>`;
    }
    return `<span class="signal-meter" aria-label="Signal ${score}/5">${bars}</span>`;
  }

  function toggleArchiveArticle(articleId) {
    if (archivedSignals.includes(articleId)) {
      archivedSignals = archivedSignals.filter(id => id !== articleId);
    } else {
      archivedSignals.push(articleId);
    }
    localStorage.setItem('the_signal_archived_ids', JSON.stringify(archivedSignals));
    renderTabs();
    renderContent();
  }

  function toggleExpand(id, btn) {
    const el = document.getElementById(`article-item-${id}`);
    if (el) {
      const isExp = el.classList.toggle('expanded');
      btn.innerText = isExp ? 'Show less ↑' : 'Read full summary ↓';
    }
  }

  function renderTabs() {
    const tabsContainer = document.getElementById('tabs-bar');
    tabsContainer.innerHTML = '';

    const discoveredTracks = new Set();
    ALL_ARTICLES.forEach(a => {
      if (a.track) {
        a.track.split(',').forEach(t => {
          const clean = t.trim();
          if (clean) discoveredTracks.add(clean);
        });
      }
    });

    const dynamicTracks = ["All", ...Array.from(discoveredTracks).sort(), "Archived"];

    dynamicTracks.forEach(track => {
      let count = 0;
      if (track === 'Archived') {
        count = archivedSignals.length;
      } else if (track === 'All') {
        count = ALL_ARTICLES.filter(a => !archivedSignals.includes(a.id)).length;
      } else {
        count = ALL_ARTICLES.filter(a => (a.track || '').toLowerCase().includes(track.toLowerCase()) && !archivedSignals.includes(a.id)).length;
      }

      const btn = document.createElement('button');
      btn.className = `tab-btn ${activeTrack === track ? 'active' : ''}`;
      btn.innerHTML = `${track}<span class="count">${count}</span>`;
      btn.onclick = () => {
        activeTrack = track;
        renderTabs();
        renderContent();
      };
      tabsContainer.appendChild(btn);
    });
  }

  function renderContent() {
    const container = document.getElementById('content');
    container.innerHTML = '';

    let filtered = [];
    if (activeTrack === 'Archived') {
      filtered = ALL_ARTICLES.filter(a => archivedSignals.includes(a.id));
    } else if (activeTrack === 'All') {
      filtered = ALL_ARTICLES.filter(a => !archivedSignals.includes(a.id));
    } else {
      filtered = ALL_ARTICLES.filter(a => (a.track || '').toLowerCase().includes(activeTrack.toLowerCase()) && !archivedSignals.includes(a.id));
    }

    if (filtered.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    document.getElementById('empty').style.display = 'none';

    filtered.forEach(article => {
      const isArchived = archivedSignals.includes(article.id);
      const isLong = (article.body || '').length > 200;
      const targetUrl = article.url || article.link || article.source_url || `https://www.google.com/search?q=${encodeURIComponent(article.headline + ' ' + (article.source || ''))}`;

      const card = document.createElement('article');
      card.className = 'article-item';
      card.id = `article-item-${article.id}`;

      card.innerHTML = `
        <div class="article-meta">
          ${signalMeter(article.relevance || 3)}
          <span class="source-label">${escapeHtml(article.source || 'Signal')}</span>
          <span class="date-label">${article.date || ''}</span>
          <button class="mark-read-btn" onclick="toggleArchiveArticle(${article.id})">
            ${isArchived ? '✓ Unarchive' : '✓ Mark Read'}
          </button>
        </div>

        <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="article-headline">
          ${escapeHtml(article.headline)}
        </a>

        <div class="article-body-wrap">
          <p class="article-body">${escapeHtml(article.body)}</p>
          ${isLong ? `<button class="read-more-btn" onclick="toggleExpand(${article.id}, this)">Read full summary ↓</button>` : ''}
        </div>

        ${article.deep_dive ? `
          <div class="deep-dive-box">
            <strong>Deep Dive:</strong> ${escapeHtml(article.deep_dive)}
          </div>
        ` : ''}

        <a class="read-source-link" href="${targetUrl}" target="_blank" rel="noopener noreferrer">
          Read original source →
        </a>
      `;
      container.appendChild(card);
    });
  }

  async function loadIssue() {
    try {
      const { data, error } = await db
        .from('articles')
        .select('*')
        .order('id', { ascending: false });

      if (error) throw error;

      document.getElementById('loading').style.display = 'none';
      ALL_ARTICLES = data || [];

      if (ALL_ARTICLES.length > 0) {
        const latestDate = ALL_ARTICLES[0].date || new Date().toISOString().split('T')[0];
        document.getElementById('issue-date').textContent = formatDate(latestDate);
      }

      renderTabs();
      renderContent();
    } catch (err) {
      document.getElementById('loading').textContent = 'Could not load articles. Check Supabase connection.';
    }
  }

  loadIssue();
</script>
</body>
</html>
