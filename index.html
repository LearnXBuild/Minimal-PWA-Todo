<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimal Task Workspace</title>
  <meta name="theme-color" content="#18181b">
  <link rel="manifest" id="pwa-manifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --surface-hover: #f1f3f5;
      --border: #e9ecef;
      --border-dark: #ced4da;
      --text: #111827;
      --text-muted: #6b7280;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-float: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
      --font-mono: 'Space Mono', monospace;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; height: 100dvh; overflow: hidden; flex-direction: row; }

    /* Sidebar */
    aside { width: 240px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; padding: 20px 14px; flex-shrink: 0; }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); padding-bottom: 80px; width: 100%; min-width: 0; }
    
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: center; gap: 8px; }
    .logo-dot { width: 8px; height: 8px; background: var(--text); border-radius: 50%; }

    .profile-icon-btn { background: var(--surface-hover); border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }

    nav { display: flex; flex-direction: column; gap: 4px; }
    nav button { display: flex; align-items: center; width: 100%; text-align: left; padding: 8px 12px; background: none; border: none; border-radius: var(--radius); font-size: 0.85rem; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s ease; }
    nav button.active, nav button:hover { background: var(--surface-hover); color: var(--text); }

    .content-section { display: none; padding: 24px 16px; max-width: 900px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .content-section.active { display: block; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
    
    /* Project Header - Plain Text feel with native click action */
    .project-title-select {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: transparent !important;
      border: none !important;
      color: var(--text);
      cursor: pointer;
      outline: none;
      padding: 0;
      width: auto;
      max-width: 320px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
    .project-title-select::-ms-expand { display: none; }

    /* Buttons & Inputs */
    .btn { background: var(--text); color: #fff; border: none; padding: 6px 14px; border-radius: var(--radius); font-size: 0.82rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-dark); }
    .btn-secondary:hover { background: var(--surface-hover); }
    .btn-danger { background: #ef4444; color: #fff; border: none; }
    .btn-sm { padding: 3px 8px; font-size: 0.72rem; border-radius: 6px; }

    input, select, textarea { border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 8px 12px; font-size: 0.85rem; width: 100%; background: var(--surface); color: var(--text); outline: none; box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { border-color: var(--text); }

    /* Filter Bar */
    .filter-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; background: var(--surface); padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .filter-top-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-chip { font-size: 0.72rem; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--border-dark); background: var(--surface); cursor: pointer; font-family: var(--font-mono); }
    .filter-chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }

    .toggle-label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); cursor: pointer; user-select: none; white-space: nowrap; }
    .toggle-label input { width: 14px; height: 14px; cursor: pointer; }

    /* Task Cards */
    .task-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .task-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--surface); box-shadow: var(--shadow-float); position: relative; width: 100%; box-sizing: border-box; transition: opacity 0.15s ease, transform 0.15s ease; }
    .task-card.completed { opacity: 0.65; }
    .task-card.completed .task-title { text-decoration: line-through; }
    
    .task-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
    .task-title { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .task-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }

    .collapse-btn { background: none; border: none; cursor: pointer; font-size: 0.8rem; color: var(--text-muted); padding: 2px 4px; display: inline-flex; align-items: center; transition: transform 0.2s ease; }
    .task-card.collapsed .collapse-btn { transform: rotate(-90deg); }
    .task-card.collapsed .task-body { display: none; }

    .pill { display: inline-flex; align-items: center; font-size: 0.68rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; font-family: var(--font-mono); }
    .pill-tag { font-family: var(--font-sans); font-weight: 500; border: 1px solid rgba(0,0,0,0.08); }

    /* Progress bar */
    .progress-bar { width: 100%; height: 5px; background: var(--surface-hover); border-radius: 3px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: var(--text); width: 0%; transition: width 0.3s ease; }

    /* Subtasks Grid */
    .subtask-tree { margin-left: 4px; padding-left: 8px; border-left: 2px solid var(--border); margin-top: 10px; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 4px); box-sizing: border-box; }
    .subtask-card { border: 1px solid var(--border); background: var(--bg); padding: 8px 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 4px; width: 100%; box-sizing: border-box; }
    .subtask-card.completed span.sub-title { text-decoration: line-through; color: var(--text-muted); }

    .subtask-grid { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 6px; width: 100%; }
    .sub-title { font-size: 0.85rem; font-weight: 600; color: var(--text); min-width: 0; width: 100%; display: block; word-break: break-all; }

    /* Timer Controls */
    .timer-badge { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.8rem; background: var(--surface-hover); padding: 4px 10px; border-radius: 6px; font-weight: 700; }

    /* Time-Slotted Calendar View */
    .time-slot-container { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .time-slot-row { display: grid; grid-template-columns: 70px 1fr; gap: 12px; border-bottom: 1px solid var(--border); padding: 8px 0; min-height: 48px; align-items: flex-start; }
    .slot-time { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
    .slot-events { display: flex; flex-direction: column; gap: 6px; }
    .time-block-card { border: 1px solid var(--border); background: var(--surface); padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: background 0.15s ease; border-left: 4px solid var(--text); box-shadow: var(--shadow-sm); }
    .time-block-card:hover { background: var(--surface-hover); }

    /* Project Manager List */
    .project-mgr-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }

    /* Modals & Profile Drawer */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 480px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 15px 30px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* Canvas & Reports */
    #graph-canvas { width: 100%; height: 380px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
    .report-card { border: 1px solid var(--border); padding: 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }

    .flex-gap { display: flex; gap: 6px; }
    .space-y { display: flex; flex-direction: column; gap: 10px; }

    @media (max-width: 640px) {
      body { flex-direction: column; }
      aside { display: none; }
      main { padding-bottom: 80px; }
      .content-section { padding: 12px; }

      .mobile-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }

      .mobile-nav {
        position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .mobile-nav button { background: none; border: none; font-size: 0.72rem; font-weight: 500; font-family: var(--font-mono); color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; }
      .mobile-nav button.active { color: var(--text); font-weight: 700; }
    }

    @media (min-width: 641px) {
      .mobile-nav, .mobile-header { display: none; }
    }
  </style>
</head>
<body>

  <!-- DESKTOP SIDEBAR -->
  <aside>
    <div class="sidebar-header">
      <div class="logo"><div class="logo-dot"></div> WORKSPACE</div>
      <button class="profile-icon-btn" onclick="openProfileModal()">👤</button>
    </div>
    <nav>
      <button class="nav-btn active" onclick="switchTab('calendar', this)">Schedule Calendar</button>
      <button class="nav-btn" onclick="switchTab('tasks', this)">Tasks & Subtasks</button>
      <button class="nav-btn" onclick="switchTab('graph', this)">Dependency Graph</button>
      <button class="nav-btn" onclick="switchTab('reports', this)">Reports & Limits</button>
    </nav>
  </aside>

  <!-- MOBILE HEADER -->
  <div class="mobile-header">
    <div class="logo"><div class="logo-dot"></div> WORKSPACE</div>
    <button class="profile-icon-btn" onclick="openProfileModal()">👤</button>
  </div>

  <main id="main-scroll-container">
    <!-- SCHEDULE CALENDAR SECTION (DEFAULT START) -->
    <section id="sec-calendar" class="content-section active">
      <header>
        <h1>SCHEDULE CALENDAR</h1>
        <button class="btn" onclick="openCalendarEventModal()">+ Time Block</button>
      </header>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <input type="date" id="cal-view-date" onchange="renderScheduleCalendar()" style="width: 160px;">
        <div style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted);" id="cal-day-label"></div>
      </div>

      <div class="time-slot-container" id="time-slots-wrapper"></div>
    </section>

    <!-- TASKS SECTION -->
    <section id="sec-tasks" class="content-section">
      <header>
        <!-- Clean Project Title Header (No dropdown arrow/border) -->
        <select id="task-project-filter" class="project-title-select" onchange="filterTasksByProjectSelect()">
          <option value="ALL">ALL PROJECTS</option>
        </select>
        
        <div class="flex-gap" style="align-items: center;">
          <button class="btn btn-secondary btn-sm" id="resync-btn" onclick="resyncSelectedProject()">↻ Sync</button>
          <button class="btn" onclick="openTaskModal()">+ Add Task</button>
        </div>
      </header>

      <div class="filter-bar">
        <div class="filter-top-row">
          <input type="text" id="search-input" placeholder="Search tasks..." oninput="renderTasks()" style="flex: 1; min-width: 140px;">
          <label class="toggle-label">
            <input type="checkbox" id="hide-completed-toggle" onchange="toggleHideCompleted()"> Hide Completed
          </label>
        </div>
        <div style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px;">FILTER BY TAGS:</div>
        <div class="filter-pills" id="tag-filters"></div>
      </div>

      <div class="task-list" id="task-container"></div>
    </section>

    <!-- DEPENDENCY GRAPH SECTION -->
    <section id="sec-graph" class="content-section">
      <header>
        <h1>GRAPH</h1>
        <div style="width: 180px;">
          <select id="graph-project-filter" onchange="renderGraph()">
            <option value="ALL">All Projects</option>
          </select>
        </div>
      </header>
      <canvas id="graph-canvas"></canvas>
    </section>

    <!-- REPORTS SECTION -->
    <section id="sec-reports" class="content-section">
      <header>
        <h1>REPORTS & LIMITS</h1>
        <div class="flex-gap">
          <button class="btn btn-secondary" onclick="openManualTimeModal()">+ Log Time</button>
          <button class="btn btn-secondary" onclick="openProjectLimitModal()">Limits</button>
        </div>
      </header>
      <div class="report-grid" id="report-container"></div>
    </section>
  </main>

  <div class="mobile-nav">
    <button class="nav-btn active" onclick="switchTab('calendar', this)">Schedule</button>
    <button class="nav-btn" onclick="switchTab('tasks', this)">Tasks</button>
    <button class="nav-btn" onclick="switchTab('graph', this)">Graph</button>
    <button class="nav-btn" onclick="switchTab('reports', this)">Reports</button>
  </div>

  <!-- PROFILE / SETTINGS DRAWER MODAL -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 16px; font-family: var(--font-mono);">Profile & Settings</h2>
      <div class="space-y">
        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">GLOBAL GITHUB ACCESS TOKEN:</label>
          <input type="password" id="global-gh-token" placeholder="ghp_xxxxxxxxxxxx" onchange="saveGlobalToken()">
        </div>
        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">ORGANIZATION / USER:</label>
          <input type="text" id="global-gh-org" placeholder="e.g. LearnXBuild" onchange="saveGlobalOrg()">
        </div>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 8px 0;">
        <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start;" onclick="closeModal('profile-modal'); openProjectManagerModal();">📂 Manage & Add Projects</button>
        <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start;" onclick="exportData()">💾 Backup Workspace JSON</button>
        <button class="btn btn-danger" style="width: 100%; justify-content: flex-start;" onclick="clearCompletedTasks()">🗑️ Clear All Completed Tasks</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('profile-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- MODAL: MANAGE & ADD PROJECTS -->
  <div class="modal-overlay" id="project-mgr-modal">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 14px; font-family: var(--font-mono);">Manage & Add Projects</h2>
      
      <div class="space-y" style="margin-bottom: 20px;">
        <div style="font-size: 0.75rem; font-weight: 700; font-family: var(--font-mono); color: var(--text-muted);">+ CREATE LOCAL PROJECT</div>
        <div class="flex-gap">
          <input type="text" id="new-local-proj-name" placeholder="Project Name">
          <input type="color" id="new-local-proj-color" value="#e2e8f0" style="width: 44px; padding: 2px; height: 34px; cursor: pointer;">
          <button class="btn btn-sm" onclick="createLocalProject()">Add</button>
        </div>
      </div>

      <div class="space-y" style="margin-bottom: 20px;">
        <div style="font-size: 0.75rem; font-weight: 700; font-family: var(--font-mono); color: var(--text-muted);">+ ADD & SYNC GITHUB PROJECT BOARD</div>
        <div class="space-y">
          <input type="text" id="new-gh-proj-title" placeholder="GitHub Project Board Title (e.g. Pass Generator)">
          <button class="btn btn-sm btn-secondary" onclick="addAndSyncNewGithubProject()">Sync & Add Project</button>
        </div>
      </div>

      <div style="font-size: 0.75rem; font-weight: 700; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 8px;">EXISTING PROJECTS</div>
      <div class="space-y" id="project-list-wrapper"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('project-mgr-modal')">Done</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD/EDIT TASK -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 12px; font-family: var(--font-mono);" id="modal-title">Create Task</h2>
      <input type="hidden" id="edit-task-id">
      
      <div class="space-y">
        <input type="text" id="t-title" placeholder="Task Title">
        <textarea id="t-desc" placeholder="Description (optional)" rows="2"></textarea>
        
        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">PROJECT:</label>
          <div class="flex-gap">
            <input type="text" id="t-project" placeholder="Project Name">
            <input type="color" id="t-project-color" value="#e2e8f0" style="width: 44px; padding: 2px; height: 34px; cursor: pointer;">
          </div>
        </div>

        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">TAGS (comma separated):</label>
          <input type="text" id="t-tags" placeholder="urgent, bug">
        </div>

        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">DEPENDS ON:</label>
          <select id="t-dep"><option value="">None</option></select>
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
        <button class="btn" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD/EDIT SUBTASK -->
  <div class="modal-overlay" id="subtask-modal">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 12px; font-family: var(--font-mono);" id="submodal-title">Subtask</h2>
      <input type="hidden" id="sub-parent-task-id">
      <input type="hidden" id="sub-edit-id">
      
      <div class="space-y">
        <input type="text" id="sub-title" placeholder="Subtask Title">
        <textarea id="sub-desc" placeholder="Description (optional)" rows="2"></textarea>
        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">TAGS:</label>
          <input type="text" id="sub-tags" placeholder="review, fix">
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('subtask-modal')">Cancel</button>
        <button class="btn" onclick="saveSubtask()">Save Subtask</button>
      </div>
    </div>
  </div>

  <!-- MODAL: CALENDAR TIME BLOCK -->
  <div class="modal-overlay" id="calendar-modal">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 12px; font-family: var(--font-mono);">Schedule Time Block</h2>
      <div class="space-y">
        <input type="text" id="cal-title" placeholder="Block Title">
        <input type="date" id="cal-date">
        <div class="flex-gap">
          <div>
            <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">START TIME:</label>
            <input type="time" id="cal-start-time" value="09:00">
          </div>
          <div>
            <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">END TIME:</label>
            <input type="time" id="cal-end-time" value="10:00">
          </div>
        </div>
        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">ASSIGN PROJECT:</label>
          <select id="cal-project-select"></select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('calendar-modal')">Cancel</button>
        <button class="btn" onclick="saveCalendarEvent()">Save Block</button>
      </div>
    </div>
  </div>

  <!-- MODAL: MANUAL TIME ENTRY -->
  <div class="modal-overlay" id="manual-time-modal">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 12px; font-family: var(--font-mono);" id="time-modal-title">Log / Edit Project Time</h2>
      <div class="space-y">
        <div>
          <label style="font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">PROJECT:</label>
          <select id="m-project-select"></select>
        </div>
        <div class="flex-gap">
          <input type="number" id="m-hours" placeholder="Hours" min="0" step="0.1">
          <input type="number" id="m-minutes" placeholder="Minutes" min="0" max="59">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('manual-time-modal')">Cancel</button>
        <button class="btn" onclick="saveManualTime()">Save Time</button>
      </div>
    </div>

  <!-- MODAL: PROJECT LIMITS -->
  <div class="modal-overlay" id="limit-modal">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 12px; font-family: var(--font-mono);">Set Project Time Limit</h2>
      <div class="space-y">
        <input type="text" id="p-name" placeholder="Project Name">
        <input type="number" id="p-limit" placeholder="Limit in Hours">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('limit-modal')">Cancel</button>
        <button class="btn" onclick="saveProjectLimit()">Save Limit</button>
      </div>
    </div>
  </div>

  <script>
    function loadAndMigrateData() {
      const MASTER_KEY = 'claude_pwa_todo_master';
      const keysToSearch = [MASTER_KEY, 'todo-pwa-v18', 'todo-pwa-v17'];

      let mergedTasks = [];
      let mergedLimits = {};
      let mergedProjectColors = {};
      let mergedTagColors = {};
      let mergedManualTimes = {};
      let mergedCollapsed = {};
      let mergedCalendarEvents = [];
      let hideCompleted = false;
      let ghToken = '';
      let ghOrg = '';

      keysToSearch.forEach(key => {
        const item = localStorage.getItem(key);
        if (item) {
          try {
            const parsed = JSON.parse(item);
            if (parsed.tasks) {
              parsed.tasks.forEach(t => {
                if (!mergedTasks.some(existing => existing.id === t.id)) mergedTasks.push(t);
              });
            }
            if (parsed.projectLimits) Object.assign(mergedLimits, parsed.projectLimits);
            if (parsed.projectColors) Object.assign(mergedProjectColors, parsed.projectColors);
            if (parsed.tagColors) Object.assign(mergedTagColors, parsed.tagColors);
            if (parsed.manualProjectTimes) Object.assign(mergedManualTimes, parsed.manualProjectTimes);
            if (parsed.collapsedTasks) Object.assign(mergedCollapsed, parsed.collapsedTasks);
            if (parsed.calendarEvents) mergedCalendarEvents = parsed.calendarEvents;
            if (parsed.hideCompleted !== undefined) hideCompleted = parsed.hideCompleted;
            if (parsed.ghToken) ghToken = parsed.ghToken;
            if (parsed.ghOrg) ghOrg = parsed.ghOrg;
          } catch(e) {}
        }
      });

      return {
        tasks: mergedTasks,
        projectLimits: mergedLimits,
        projectColors: mergedProjectColors,
        tagColors: mergedTagColors,
        manualProjectTimes: mergedManualTimes,
        collapsedTasks: mergedCollapsed,
        calendarEvents: mergedCalendarEvents,
        hideCompleted,
        ghToken,
        ghOrg
      };
    }

    let appData = loadAndMigrateData();
    let selectedFilterTags = new Set();
    let activeTimer = null;

    function saveData() {
      localStorage.setItem('claude_pwa_todo_master', JSON.stringify(appData));
    }

    function openProfileModal() { 
      document.getElementById('global-gh-token').value = appData.ghToken || '';
      document.getElementById('global-gh-org').value = appData.ghOrg || '';
      document.getElementById('profile-modal').style.display = 'flex'; 
    }

    function saveGlobalToken() {
      appData.ghToken = document.getElementById('global-gh-token').value.trim();
      saveData();
    }

    function saveGlobalOrg() {
      appData.ghOrg = document.getElementById('global-gh-org').value.trim();
      saveData();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `workspace_backup_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function clearCompletedTasks() {
      if (confirm("Are you sure you want to clear all completed tasks?")) {
        appData.tasks = appData.tasks.filter(t => !t.completed);
        saveData();
        closeModal('profile-modal');
        renderTasks();
      }
    }

    function toggleHideCompleted() {
      appData.hideCompleted = document.getElementById('hide-completed-toggle').checked;
      saveData();
      renderTasks();
    }

    const PRESET_COLORS = ['#fee2e2', '#fef3c7', '#dcfce7', '#e0e7ff', '#f3e8ff', '#fce7f3'];
    function getRandomColor() { return PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)]; }

    /* Fix: Reset Scroll Position when Switching Tabs */
    function switchTab(tab, element) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
      
      const targets = document.querySelectorAll(`[onclick*="'${tab}'"]`);
      targets.forEach(t => t.classList.add('active'));

      document.getElementById(`sec-${tab}`).classList.add('active');

      // RESET SCROLL CONTAINER POSITION TO TOP
      const mainContainer = document.getElementById('main-scroll-container');
      if (mainContainer) mainContainer.scrollTop = 0;

      if (tab === 'calendar') renderScheduleCalendar();
      if (tab === 'graph') renderGraph();
      if (tab === 'reports') renderReports();
    }

    /* --- PROJECT MANAGER --- */
    function openProjectManagerModal() {
      renderProjectManagerList();
      document.getElementById('project-mgr-modal').style.display = 'flex';
    }

    function createLocalProject() {
      const name = document.getElementById('new-local-proj-name').value.trim();
      const color = document.getElementById('new-local-proj-color').value;

      if (name) {
        appData.projectColors[name] = color;
        saveData();
        document.getElementById('new-local-proj-name').value = '';
        renderProjectManagerList();
        updateProjectDropdowns();
        renderTasks();
      }
    }

    async function addAndSyncNewGithubProject() {
      const projTitle = document.getElementById('new-gh-proj-title').value.trim();
      if (!projTitle) return;

      if (!appData.ghToken || !appData.ghOrg) {
        alert("Please configure your GitHub Access Token and Org Name in Profile Settings (👤) first.");
        openProfileModal();
        return;
      }

      await syncGithubProjectByName(projTitle);
      document.getElementById('new-gh-proj-title').value = '';
      renderProjectManagerList();
    }

    function deleteProject(projName) {
      if (confirm(`Are you sure you want to delete project '${projName}' and remove its associated tasks?`)) {
        appData.tasks = appData.tasks.filter(t => t.project !== projName);
        delete appData.projectColors[projName];
        delete appData.projectLimits[projName];
        delete appData.manualProjectTimes[projName];

        saveData();
        renderProjectManagerList();
        updateProjectDropdowns();
        renderTasks();
        renderReports();
      }
    }

    function renderProjectManagerList() {
      const wrapper = document.getElementById('project-list-wrapper');
      wrapper.innerHTML = '';

      const allProjects = new Set([
        ...Object.keys(appData.projectColors || {}),
        ...appData.tasks.map(t => t.project).filter(Boolean)
      ]);

      if (allProjects.size === 0) {
        wrapper.innerHTML = `<div style="font-size:0.78rem; color:var(--text-muted); font-family:var(--font-mono);">No projects added yet.</div>`;
        return;
      }

      allProjects.forEach(proj => {
        const color = appData.projectColors[proj] || '#e2e8f0';
        const taskCount = appData.tasks.filter(t => t.project === proj).length;

        const item = document.createElement('div');
        item.className = 'project-mgr-item';
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="width:12px; height:12px; border-radius:50%; background:${color}; display:inline-block;"></span>
            <span style="font-weight:600; font-size:0.88rem;">${proj}</span>
            <span style="font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono);">(${taskCount} tasks)</span>
          </div>
          <div class="flex-gap">
            <button class="btn btn-secondary btn-sm" onclick="syncGithubProjectByName('${proj}')">↻ Sync</button>
            <button class="btn btn-danger btn-sm" onclick="deleteProject('${proj}')">Delete</button>
          </div>
        `;
        wrapper.appendChild(item);
      });
    }

    /* --- TASK & SUBTASK MANAGEMENT --- */
    function filterTasksByProjectSelect() { renderTasks(); }

    function toggleCollapseTask(taskId) {
      if (!appData.collapsedTasks) appData.collapsedTasks = {};
      appData.collapsedTasks[taskId] = !appData.collapsedTasks[taskId];
      saveData();
      renderTasks();
    }

    function openTaskModal(taskId = null) {
      const depSelect = document.getElementById('t-dep');
      depSelect.innerHTML = '<option value="">None</option>';
      
      appData.tasks.forEach(t => {
        if (t.id !== taskId) depSelect.innerHTML += `<option value="${t.id}">${t.title}</option>`;
      });

      if (taskId) {
        const task = appData.tasks.find(t => t.id === taskId);
        document.getElementById('modal-title').innerText = 'Edit Task';
        document.getElementById('edit-task-id').value = task.id;
        document.getElementById('t-title').value = task.title;
        document.getElementById('t-desc').value = task.description || '';
        document.getElementById('t-project').value = task.project || '';
        document.getElementById('t-project-color').value = appData.projectColors[task.project] || '#e2e8f0';
        document.getElementById('t-tags').value = task.tags ? task.tags.join(', ') : '';
        document.getElementById('t-dep').value = task.dependsOn || '';
      } else {
        document.getElementById('modal-title').innerText = 'Create Task';
        document.getElementById('edit-task-id').value = '';
        document.getElementById('t-title').value = '';
        document.getElementById('t-desc').value = '';
        document.getElementById('t-project').value = '';
        document.getElementById('t-tags').value = '';
        document.getElementById('t-dep').value = '';
      }

      document.getElementById('task-modal').style.display = 'flex';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveTask() {
      const title = document.getElementById('t-title').value.trim();
      if (!title) return;

      const editId = document.getElementById('edit-task-id').value;
      const project = document.getElementById('t-project').value.trim();
      const projColor = document.getElementById('t-project-color').value;
      const tags = document.getElementById('t-tags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
      const dependsOn = document.getElementById('t-dep').value;

      if (project) appData.projectColors[project] = projColor;
      tags.forEach(tag => { if (!appData.tagColors[tag]) appData.tagColors[tag] = getRandomColor(); });

      if (editId) {
        const task = appData.tasks.find(t => t.id === editId);
        if (task) {
          task.title = title;
          task.description = document.getElementById('t-desc').value;
          task.project = project;
          task.tags = tags;
          task.dependsOn = dependsOn || null;
        }
      } else {
        appData.tasks.push({
          id: 'task_' + Date.now(),
          title,
          description: document.getElementById('t-desc').value,
          project,
          tags,
          dependsOn: dependsOn || null,
          completed: false,
          subtasks: [],
          timeSpent: 0
        });
      }

      saveData();
      closeModal('task-modal');
      updateProjectDropdowns();
      renderTagFilters();
      renderTasks();
    }

    function toggleTaskComplete(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        saveData();
        renderTasks();
      }
    }

    function deleteTask(id) {
      appData.tasks = appData.tasks.filter(t => t.id !== id);
      saveData();
      updateProjectDropdowns();
      renderTagFilters();
      renderTasks();
    }

    function openSubtaskModal(parentTaskId, subId = null) {
      document.getElementById('sub-parent-task-id').value = parentTaskId;
      document.getElementById('sub-edit-id').value = subId || '';

      if (subId) {
        const task = appData.tasks.find(t => t.id === parentTaskId);
        const sub = task ? task.subtasks.find(s => s.id === subId) : null;
        if (sub) {
          document.getElementById('submodal-title').innerText = 'Edit Subtask';
          document.getElementById('sub-title').value = sub.title;
          document.getElementById('sub-desc').value = sub.description || '';
          document.getElementById('sub-tags').value = sub.tags ? sub.tags.join(', ') : '';
        }
      } else {
        document.getElementById('submodal-title').innerText = 'Add Subtask';
        document.getElementById('sub-title').value = '';
        document.getElementById('sub-desc').value = '';
        document.getElementById('sub-tags').value = '';
      }

      document.getElementById('subtask-modal').style.display = 'flex';
    }

    function saveSubtask() {
      const parentTaskId = document.getElementById('sub-parent-task-id').value;
      const subId = document.getElementById('sub-edit-id').value;
      const title = document.getElementById('sub-title').value.trim();
      if (!title) return;

      const desc = document.getElementById('sub-desc').value;
      const tags = document.getElementById('sub-tags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
      tags.forEach(tag => { if (!appData.tagColors[tag]) appData.tagColors[tag] = getRandomColor(); });

      const task = appData.tasks.find(t => t.id === parentTaskId);
      if (task) {
        if (subId) {
          const sub = task.subtasks.find(s => s.id === subId);
          if (sub) { sub.title = title; sub.description = desc; sub.tags = tags; }
        } else {
          task.subtasks.push({ id: 'sub_' + Date.now(), title, description: desc, tags, completed: false });
        }
        saveData();
        closeModal('subtask-modal');
        renderTagFilters();
        renderTasks();
      }
    }

    function toggleSubtask(taskId, subId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        const sub = task.subtasks.find(s => s.id === subId);
        if (sub) sub.completed = !sub.completed;
        saveData();
        renderTasks();
      }
    }

    function deleteSubtask(taskId, subId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.subtasks = task.subtasks.filter(s => s.id !== subId);
        saveData();
        renderTasks();
      }
    }

    /* --- TARGETED SINGLE-PROJECT GITHUB GRAPHQL SYNC --- */
    async function resyncSelectedProject() {
      const targetProj = document.getElementById('task-project-filter').value;
      if (targetProj === 'ALL') {
        alert("Please tap the project title to select a project to sync.");
        return;
      }
      await syncGithubProjectByName(targetProj);
    }

    async function syncGithubProjectByName(projName) {
      if (!appData.ghToken || !appData.ghOrg) {
        openProfileModal();
        alert("Please configure your GitHub Access Token and Org Name in Profile Settings (👤) first.");
        return;
      }

      const graphqlQuery = {
        query: `
          query($org: String!, $searchTitle: String!) {
            organization(login: $org) {
              projectsV2(first: 10, query: $searchTitle) {
                nodes {
                  id
                  title
                  items(first: 30) {
                    nodes {
                      id
                      fieldValues(first: 5) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            field { ... on ProjectV2SingleSelectField { name } }
                          }
                        }
                      }
                      content {
                        ... on Issue {
                          id
                          title
                          body
                          state
                          labels(first: 5) { nodes { name } }
                          subIssues(first: 10) {
                            nodes {
                              title
                              state
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        `,
        variables: { org: appData.ghOrg, searchTitle: projName }
      };

      try {
        const res = await fetch('https://api.github.com/graphql', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${appData.ghToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(graphqlQuery)
        });

        const json = await res.json();
        if (json.errors) throw new Error(json.errors[0].message);

        const projects = json.data?.organization?.projectsV2?.nodes || [];
        const foundBoard = projects.find(p => p.title.toLowerCase().includes(projName.toLowerCase()));

        if (!foundBoard) throw new Error(`Project board matching '${projName}' not found on GitHub.`);

        if (!appData.projectColors[projName]) {
          appData.projectColors[projName] = getRandomColor();
        }

        let count = 0;
        const items = foundBoard.items.nodes || [];

        items.forEach(item => {
          if (!item.content || !item.content.title) return;

          let statusName = '';
          (item.fieldValues.nodes || []).forEach(fv => {
            if (fv.field && fv.field.name === 'Status' && fv.name) {
              statusName = fv.name.toLowerCase();
            }
          });

          if (statusName === 'in progress' || statusName === 'in_progress' || statusName === 'wip') {
            const title = item.content.title;
            const bodyText = item.content.body || '';

            const subtasks = [];

            if (item.content.subIssues && item.content.subIssues.nodes) {
              item.content.subIssues.nodes.forEach(sub => {
                subtasks.push({
                  id: 'sub_' + Date.now() + Math.random(),
                  title: sub.title,
                  completed: sub.state === 'CLOSED',
                  description: 'Native Sub-issue',
                  tags: ['sub-issue']
                });
              });
            }

            const checklistRegex = /- \[(x| )\] (.*)/g;
            let match;
            while ((match = checklistRegex.exec(bodyText)) !== null) {
              subtasks.push({
                id: 'sub_' + Date.now() + Math.random(),
                title: match[2].trim(),
                completed: match[1] === 'x',
                description: '',
                tags: ['checklist']
              });
            }

            const rawLabels = (item.content.labels?.nodes || []).map(l => l.name.toLowerCase());
            rawLabels.forEach(t => { if (!appData.tagColors[t]) appData.tagColors[t] = getRandomColor(); });

            let existingTask = appData.tasks.find(t => t.title === title && t.project === projName);
            if (!existingTask) {
              appData.tasks.push({
                id: 'task_' + Date.now() + Math.random(),
                title,
                description: bodyText ? bodyText.slice(0, 150) + '...' : '',
                project: projName,
                tags: rawLabels,
                dependsOn: null,
                completed: false,
                subtasks,
                timeSpent: 0
              });
              count++;
            } else {
              existingTask.subtasks = subtasks;
            }
          }
        });

        saveData();
        updateProjectDropdowns();
        renderTagFilters();
        renderTasks();
        alert(`Synced '${projName}'! ${count} new in-progress items loaded.`);
      } catch(err) {
        alert("Sync Error: " + err.message);
      }
    }

    /* --- SCHEDULE CALENDAR SYSTEM WITH TIME SLOTS --- */
    function openCalendarEventModal() {
      updateProjectDropdowns();
      document.getElementById('cal-title').value = '';
      const dateVal = document.getElementById('cal-view-date').value || new Date().toISOString().split('T')[0];
      document.getElementById('cal-date').value = dateVal;
      document.getElementById('calendar-modal').style.display = 'flex';
    }

    function saveCalendarEvent() {
      const title = document.getElementById('cal-title').value.trim();
      const date = document.getElementById('cal-date').value;
      const startTime = document.getElementById('cal-start-time').value;
      const endTime = document.getElementById('cal-end-time').value;
      const project = document.getElementById('cal-project-select').value;

      if (title && date && startTime) {
        if (!appData.calendarEvents) appData.calendarEvents = [];
        appData.calendarEvents.push({ id: 'cal_' + Date.now(), title, date, startTime, endTime, project });
        saveData();
        closeModal('calendar-modal');
        renderScheduleCalendar();
      }
    }

    function jumpToTasksWithProject(projName) {
      const tasksBtn = document.querySelectorAll('.nav-btn')[1];
      switchTab('tasks', tasksBtn);
      
      if (projName) {
        document.getElementById('task-project-filter').value = projName;
        renderTasks();
      }
    }

    function renderScheduleCalendar() {
      const viewInput = document.getElementById('cal-view-date');
      if (!viewInput.value) {
        viewInput.value = new Date().toISOString().split('T')[0];
      }

      const dateStr = viewInput.value;
      const dateObj = new Date(dateStr + 'T00:00:00');
      document.getElementById('cal-day-label').innerText = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

      const container = document.getElementById('time-slots-wrapper');
      container.innerHTML = '';

      const dayEvents = (appData.calendarEvents || []).filter(e => e.date === dateStr);

      for (let hour = 0; hour < 24; hour++) {
        const hourStr = `${String(hour).padStart(2, '0')}:00`;
        const slotRow = document.createElement('div');
        slotRow.className = 'time-slot-row';

        const matchingEvents = dayEvents.filter(e => {
          const eventHour = parseInt(e.startTime.split(':')[0], 10);
          return eventHour === hour;
        });

        slotRow.innerHTML = `
          <div class="slot-time">${hourStr}</div>
          <div class="slot-events">
            ${matchingEvents.map(evt => `
              <div class="time-block-card" onclick="jumpToTasksWithProject('${evt.project}')">
                <div style="font-weight:700; font-size:0.85rem;">${evt.title}</div>
                <div style="font-size:0.72rem; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px;">
                  ${evt.startTime} - ${evt.endTime} ${evt.project ? `| ${evt.project}` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(slotRow);
      }
    }

    /* --- TIMER FUNCTIONS --- */
    function toggleTimer(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);

      if (activeTimer && activeTimer.taskId === taskId) {
        clearInterval(activeTimer.timerId);
        const elapsed = Math.floor((Date.now() - activeTimer.startTime) / 1000);
        if (task) task.timeSpent += elapsed;
        activeTimer = null;
        saveData();
        renderTasks();
      } else {
        if (activeTimer) toggleTimer(activeTimer.taskId);

        activeTimer = {
          taskId,
          startTime: Date.now(),
          timerId: setInterval(() => updateTimerDisplay(taskId), 1000)
        };
        renderTasks();
      }
    }

    function updateTimerDisplay(taskId) {
      const el = document.getElementById(`timer-val-${taskId}`);
      if (el && activeTimer) {
        const currentElapsed = Math.floor((Date.now() - activeTimer.startTime) / 1000);
        const task = appData.tasks.find(t => t.id === taskId);
        const total = (task ? task.timeSpent : 0) + currentElapsed;
        el.innerText = formatTime(total);
      }
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h > 0 ? h + 'h ' : ''}${m}m ${s}s`;
    }

    /* --- RENDER TASKS & SUBTASKS --- */
    function renderTagFilters() {
      const container = document.getElementById('tag-filters');
      container.innerHTML = '';
      
      const allTags = new Set();
      appData.tasks.forEach(t => {
        (t.tags || []).forEach(tag => allTags.add(tag));
        (t.subtasks || []).forEach(sub => (sub.tags || []).forEach(tag => allTags.add(tag)));
      });

      allTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = `filter-chip ${selectedFilterTags.has(tag) ? 'active' : ''}`;
        chip.innerText = `#${tag}`;
        chip.onclick = () => {
          if (selectedFilterTags.has(tag)) selectedFilterTags.delete(tag);
          else selectedFilterTags.add(tag);
          renderTagFilters();
          renderTasks();
        };
        container.appendChild(chip);
      });
    }

    function renderTasks() {
      const container = document.getElementById('task-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const selectedProjectFilter = document.getElementById('task-project-filter').value;
      
      document.getElementById('hide-completed-toggle').checked = !!appData.hideCompleted;
      container.innerHTML = '';

      let filtered = appData.tasks.filter(task => {
        if (appData.hideCompleted && task.completed) return false;
        if (selectedProjectFilter !== 'ALL' && task.project !== selectedProjectFilter) return false;

        const matchesSearch = task.title.toLowerCase().includes(searchQuery) || (task.project && task.project.toLowerCase().includes(searchQuery));
        const matchesTags = selectedFilterTags.size === 0 || 
          Array.from(selectedFilterTags).every(t => (task.tags || []).includes(t));
        return matchesSearch && matchesTags;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px 0; font-family: var(--font-mono); font-size: 0.85rem;">No tasks found.</div>`;
        return;
      }

      filtered.forEach(task => {
        const totalSub = task.subtasks.length;
        const doneSub = task.subtasks.filter(s => s.completed).length;
        const progressPct = totalSub === 0 ? 0 : Math.round((doneSub / totalSub) * 100);
        const isRunning = activeTimer && activeTimer.taskId === task.id;
        const projColor = appData.projectColors[task.project] || '#e2e8f0';
        const isCollapsed = appData.collapsedTasks && appData.collapsedTasks[task.id];

        const card = document.createElement('div');
        card.className = `task-card ${task.completed ? 'completed' : ''} ${isCollapsed ? 'collapsed' : ''}`;

        card.innerHTML = `
          <div class="task-header">
            <button class="collapse-btn" onclick="toggleCollapseTask('${task.id}')">▼</button>
            <div class="task-title">
              <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskComplete('${task.id}')" style="width: 16px; height: 16px; cursor: pointer;">
              <span>${task.title}</span>
            </div>
            <div class="flex-gap">
              <button class="btn btn-secondary btn-sm" onclick="openTaskModal('${task.id}')">Edit</button>
              <button class="btn btn-secondary btn-sm" onclick="deleteTask('${task.id}')">Delete</button>
            </div>
          </div>

          <div class="task-body">
            ${task.description ? `<div style="font-size: 0.78rem; color: var(--text-muted); margin: 6px 0;">${task.description}</div>` : ''}

            <div class="task-meta">
              ${task.project ? `<span class="pill" style="background:${projColor}; color:#1e293b;">${task.project}</span>` : ''}
              ${(task.tags || []).map(t => `<span class="pill pill-tag" style="background:${appData.tagColors[t] || '#f1f5f9'};">#${t}</span>`).join('')}
            </div>

            <div style="font-size: 0.7rem; color: var(--text-muted); display: flex; justify-content: space-between; font-family: var(--font-mono);">
              <span>Progress</span>
              <span>${doneSub}/${totalSub} (${progressPct}%)</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progressPct}%"></div></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
              <div class="timer-badge">
                <span id="timer-val-${task.id}">${formatTime(task.timeSpent)}</span>
              </div>
              <button class="btn btn-sm ${isRunning ? 'btn-secondary' : ''}" onclick="toggleTimer('${task.id}')">
                ${isRunning ? 'Pause' : 'Start Timer'}
              </button>
            </div>

            <div class="subtask-tree">
              ${task.subtasks.map(sub => `
                <div class="subtask-card ${sub.completed ? 'completed' : ''}">
                  <div class="subtask-grid">
                    <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubtask('${task.id}', '${sub.id}')" style="cursor: pointer;">
                    <span class="sub-title">${sub.title}</span>
                    <div class="flex-gap">
                      <button class="btn btn-secondary btn-sm" style="padding: 1px 5px; font-size: 0.68rem;" onclick="openSubtaskModal('${task.id}', '${sub.id}')">Edit</button>
                      <button class="btn btn-secondary btn-sm" style="padding: 1px 5px; font-size: 0.68rem;" onclick="deleteSubtask('${task.id}', '${sub.id}')">✕</button>
                    </div>
                  </div>

                  ${(sub.tags && sub.tags.length > 0) ? `
                    <div style="display:flex; gap:3px; margin-left:26px; margin-top:4px; flex-wrap:wrap;">
                      ${sub.tags.map(st => `<span class="pill pill-tag" style="background:${appData.tagColors[st] || '#f1f5f9'}; font-size: 0.62rem; padding: 0px 5px;">#${st}</span>`).join('')}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
              
              <button class="btn btn-secondary btn-sm" style="align-self: flex-start; margin-top: 2px;" onclick="openSubtaskModal('${task.id}')">
                + Add Subtask
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* --- GRAPH & REPORTS --- */
    function updateProjectDropdowns() {
      const taskProjSelect = document.getElementById('task-project-filter');
      const graphSelect = document.getElementById('graph-project-filter');
      const manualSelect = document.getElementById('m-project-select');
      const calSelect = document.getElementById('cal-project-select');

      const allProjects = new Set([
        ...Object.keys(appData.projectColors || {}),
        ...appData.tasks.map(t => t.project).filter(Boolean),
        ...Object.keys(appData.manualProjectTimes || {})
      ]);

      const currTaskVal = taskProjSelect.value;

      taskProjSelect.innerHTML = '<option value="ALL">ALL PROJECTS</option>';
      graphSelect.innerHTML = '<option value="ALL">All Projects</option>';
      manualSelect.innerHTML = '';
      if (calSelect) calSelect.innerHTML = '<option value="">None</option>';

      allProjects.forEach(proj => {
        taskProjSelect.innerHTML += `<option value="${proj}">${proj.toUpperCase()}</option>`;
        graphSelect.innerHTML += `<option value="${proj}">${proj}</option>`;
        manualSelect.innerHTML += `<option value="${proj}">${proj}</option>`;
        if (calSelect) calSelect.innerHTML += `<option value="${proj}">${proj}</option>`;
      });

      taskProjSelect.value = currTaskVal || 'ALL';
    }

    function renderGraph() {
      const canvas = document.getElementById('graph-canvas');
      const ctx = canvas.getContext('2d');
      const selectedProj = document.getElementById('graph-project-filter').value;

      canvas.width = canvas.parentElement.clientWidth - 32;
      canvas.height = 380;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let tasksToRender = appData.tasks;
      if (selectedProj !== 'ALL') {
        tasksToRender = appData.tasks.filter(t => t.project === selectedProj);
      }

      if (tasksToRender.length === 0) return;

      const nodes = tasksToRender.map((t, i) => ({
        ...t,
        x: 70 + (i % 2) * (canvas.width - 140),
        y: 50 + Math.floor(i / 2) * 80
      }));

      nodes.forEach(node => {
        if (node.dependsOn) {
          const target = nodes.find(n => n.id === node.dependsOn);
          if (target) {
            ctx.beginPath();
            ctx.moveTo(target.x, target.y);
            ctx.lineTo(node.x, node.y);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }
      });

      nodes.forEach(node => {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(node.x - 55, node.y - 18, 110, 36, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = '10px Space Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(node.title.length > 12 ? node.title.slice(0, 10) + '...' : node.title, node.x, node.y + 4);
      });
    }

    function openManualTimeModal(targetProject = null) {
      updateProjectDropdowns();
      if (targetProject) {
        document.getElementById('m-project-select').value = targetProject;
        const currentSec = (appData.manualProjectTimes || {})[targetProject] || 0;
        document.getElementById('m-hours').value = (currentSec / 3600).toFixed(1);
        document.getElementById('m-minutes').value = '0';
      } else {
        document.getElementById('m-hours').value = '';
        document.getElementById('m-minutes').value = '';
      }
      document.getElementById('manual-time-modal').style.display = 'flex';
    }

    function saveManualTime() {
      const project = document.getElementById('m-project-select').value;
      const hrs = parseFloat(document.getElementById('m-hours').value) || 0;
      const mins = parseFloat(document.getElementById('m-minutes').value) || 0;

      const totalSec = (hrs * 3600) + (mins * 60);
      if (project) {
        if (!appData.manualProjectTimes) appData.manualProjectTimes = {};
        appData.manualProjectTimes[project] = totalSec;
        saveData();
        closeModal('manual-time-modal');
        renderReports();
      }
    }

    function openProjectLimitModal() {
      document.getElementById('p-name').value = '';
      document.getElementById('p-limit').value = '';
      document.getElementById('limit-modal').style.display = 'flex';
    }

    function saveProjectLimit() {
      const name = document.getElementById('p-name').value.trim();
      const limit = parseFloat(document.getElementById('p-limit').value);
      if (name && !isNaN(limit)) {
        appData.projectLimits[name] = limit;
        saveData();
        closeModal('limit-modal');
        renderReports();
      }
    }

    function renderReports() {
      const container = document.getElementById('report-container');
      container.innerHTML = '';

      const projectTimes = {};

      appData.tasks.forEach(task => {
        if (task.project) {
          projectTimes[task.project] = (projectTimes[task.project] || 0) + task.timeSpent;
        }
      });

      Object.entries(appData.manualProjectTimes || {}).forEach(([proj, sec]) => {
        projectTimes[proj] = (projectTimes[proj] || 0) + sec;
      });

      const allProjects = new Set([...Object.keys(projectTimes), ...Object.keys(appData.projectLimits)]);

      if (allProjects.size === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem;">No project time tracked yet.</div>`;
        return;
      }

      allProjects.forEach(proj => {
        const spentSec = projectTimes[proj] || 0;
        const spentHours = (spentSec / 3600).toFixed(2);
        const limitHours = appData.projectLimits[proj] || null;

        let statusText = `${spentHours} hrs spent`;
        let pct = 0;

        if (limitHours) {
          pct = Math.min(Math.round((spentHours / limitHours) * 100), 100);
          statusText += ` of ${limitHours} hrs limit (${pct}%)`;
        }

        const card = document.createElement('div');
        card.className = 'report-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight: 700; font-family: var(--font-mono); font-size: 0.95rem;">${proj}</div>
            <button class="btn btn-secondary btn-sm" onclick="openManualTimeModal('${proj}')">Edit Logged Time</button>
          </div>
          <div style="font-size: 0.78rem; color: var(--text-muted); margin: 8px 0;">${statusText}</div>
          ${limitHours ? `
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${pct}%; background: ${pct >= 100 ? '#ef4444' : 'var(--text)'};"></div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    /* --- PWA REGISTRATION --- */
    const manifestBlob = new Blob([JSON.stringify({
      name: "Minimal Task Workspace",
      short_name: "Tasks",
      start_url: "./",
      display: "standalone",
      background_color: "#ffffff",
      theme_color: "#18181b",
      icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/></svg>", sizes: "192x192 512x512", type: "image/svg+xml" }]
    })], { type: 'application/json' });
    document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'todo-pwa-v19';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }

    updateProjectDropdowns();
    renderTagFilters();
    renderScheduleCalendar();
  </script>
</body>
</html>
