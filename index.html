<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimal Task Workspace</title>
  <meta name="theme-color" content="#18181b">
  <link rel="manifest" id="pwa-manifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --surface-hover: #f1f3f5;
      --border: #e9ecef;
      --border-dark: #ced4da;
      --text: #111827;
      --text-muted: #6b7280;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-float: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --font-mono: 'Space Mono', monospace;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; height: 100dvh; overflow: hidden; flex-direction: row; }

    /* Desktop Sidebar */
    aside { width: 250px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; padding: 24px 16px; flex-shrink: 0; }
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); padding-bottom: 80px; width: 100%; min-width: 0; }
    
    .logo { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 10px; height: 10px; background: var(--text); border-radius: 50%; }

    nav { display: flex; flex-direction: column; gap: 6px; }
    nav button { display: flex; align-items: center; width: 100%; text-align: left; padding: 10px 14px; background: none; border: none; border-radius: var(--radius); font-size: 0.88rem; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s ease; }
    nav button.active, nav button:hover { background: var(--surface-hover); color: var(--text); }

    .content-section { display: none; padding: 32px; max-width: 960px; margin: 0 auto; width: 100%; }
    .content-section.active { display: block; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); gap: 12px; }
    h1 { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

    /* Buttons & Inputs */
    .btn { background: var(--text); color: #fff; border: none; padding: 8px 16px; border-radius: var(--radius); font-size: 0.85rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: transform 0.1s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-dark); }
    .btn-secondary:hover { background: var(--surface-hover); }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; border-radius: 8px; }

    input, select, textarea { border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 10px 14px; font-size: 0.88rem; width: 100%; background: var(--surface); color: var(--text); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--text); }

    /* Search & Filters */
    .filter-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; background: var(--surface); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-chip { font-size: 0.75rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border-dark); background: var(--surface); cursor: pointer; font-family: var(--font-mono); user-select: none; }
    .filter-chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }

    /* Task Cards */
    .task-list { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    .task-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; background: var(--surface); box-shadow: var(--shadow-float); transition: transform 0.15s ease, box-shadow 0.15s ease; position: relative; width: 100%; box-sizing: border-box; overflow: hidden; }
    .task-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.08); }
    .task-card.completed { opacity: 0.6; }
    .task-card.completed .task-title { text-decoration: line-through; }
    
    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; width: 100%; }
    .task-title { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 10px; min-width: 0; word-break: break-word; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }

    .pill { display: inline-flex; align-items: center; font-size: 0.72rem; padding: 3px 10px; border-radius: 99px; font-weight: 600; font-family: var(--font-mono); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill-tag { font-family: var(--font-sans); font-weight: 500; border: 1px solid rgba(0,0,0,0.1); }

    /* Progress bar */
    .progress-bar { width: 100%; height: 6px; background: var(--surface-hover); border-radius: 3px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: var(--text); width: 0%; transition: width 0.3s ease; }

    /* Subtasks */
    .subtask-tree { margin-left: 8px; padding-left: 12px; border-left: 2px solid var(--border); margin-top: 14px; display: flex; flex-direction: column; gap: 10px; width: calc(100% - 8px); box-sizing: border-box; }
    .subtask-card { border: 1px solid var(--border); background: var(--bg); padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box; }
    .subtask-card.completed span.sub-title { text-decoration: line-through; color: var(--text-muted); }
    
    .subtask-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
    .subtask-main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .sub-title { font-size: 0.88rem; font-weight: 500; word-break: break-word; min-width: 0; }
    .sub-desc { font-size: 0.78rem; color: var(--text-muted); margin-left: 26px; word-break: break-word; }

    /* Timer Controls */
    .timer-badge { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.85rem; background: var(--surface-hover); padding: 6px 12px; border-radius: 8px; font-weight: 700; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 520px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* Graph Canvas */
    #graph-canvas { width: 100%; height: 420px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }

    /* Reports Grid */
    .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
    .report-card { border: 1px solid var(--border); padding: 20px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }

    .flex-gap { display: flex; gap: 8px; }
    .space-y { display: flex; flex-direction: column; gap: 12px; }

    @media (max-width: 640px) {
      body { flex-direction: column; }
      aside { display: none; }
      main { padding-bottom: 90px; }
      .content-section { padding: 16px; }

      .mobile-nav {
        position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
      }
      .mobile-nav button { background: none; border: none; font-size: 0.75rem; font-weight: 500; font-family: var(--font-mono); color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; }
      .mobile-nav button.active { color: var(--text); font-weight: 700; }
    }

    @media (min-width: 641px) {
      .mobile-nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- Audio Element for iOS LockScreen MediaSession -->
  <audio id="silent-audio" loop playsinline src="data:audio/mp3;base64,SUQ3BAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA////xAAAAAAAAAAAAAAAAAAAAAAAAAAA="></audio>

  <!-- DESKTOP SIDEBAR -->
  <aside>
    <div class="logo"><div class="logo-dot"></div> WORKSPACE</div>
    <nav>
      <button class="nav-btn active" onclick="switchTab('tasks', this)">Tasks & Subtasks</button>
      <button class="nav-btn" onclick="switchTab('graph', this)">Dependency Graph</button>
      <button class="nav-btn" onclick="switchTab('reports', this)">Reports & Limits</button>
    </nav>
  </aside>

  <main>
    <!-- TASKS SECTION -->
    <section id="sec-tasks" class="content-section active">
      <header>
        <h1>TASKS</h1>
        <button class="btn" onclick="openTaskModal()">+ Add Task</button>
      </header>

      <!-- SEARCH & FILTERS -->
      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Search tasks by title..." oninput="renderTasks()">
        <div style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">FILTER BY TAGS:</div>
        <div class="filter-pills" id="tag-filters"></div>
      </div>

      <div class="task-list" id="task-container"></div>
    </section>

    <!-- DEPENDENCY GRAPH SECTION -->
    <section id="sec-graph" class="content-section">
      <header>
        <h1>DEPENDENCY GRAPH</h1>
      </header>
      <canvas id="graph-canvas"></canvas>
    </section>

    <!-- REPORTS SECTION -->
    <section id="sec-reports" class="content-section">
      <header>
        <h1>REPORTS & LIMITS</h1>
        <button class="btn btn-secondary" onclick="openProjectLimitModal()">Project Limits</button>
      </header>
      <div class="report-grid" id="report-container"></div>
    </section>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <div class="mobile-nav">
    <button class="nav-btn active" onclick="switchTab('tasks', this)">Tasks</button>
    <button class="nav-btn" onclick="switchTab('graph', this)">Graph</button>
    <button class="nav-btn" onclick="switchTab('reports', this)">Reports</button>
  </div>

  <!-- ADD/EDIT TASK MODAL -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <h2 style="font-size: 1.1rem; margin-bottom: 14px; font-family: var(--font-mono);" id="modal-title">Create Task</h2>
      <input type="hidden" id="edit-task-id">
      
      <div class="space-y">
        <input type="text" id="t-title" placeholder="Task Title">
        <textarea id="t-desc" placeholder="Description (optional)" rows="2"></textarea>
        
        <div>
          <label style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">PROJECT:</label>
          <div class="flex-gap">
            <input type="text" id="t-project" placeholder="Project Name (e.g. Core App)">
            <input type="color" id="t-project-color" value="#e2e8f0" style="width: 50px; padding: 2px; height: 38px; cursor: pointer;">
          </div>
        </div>

        <div>
          <label style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">TAGS (comma separated):</label>
          <input type="text" id="t-tags" placeholder="e.g. urgent, backend, bug">
        </div>

        <div>
          <label style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">DEPENDS ON:</label>
          <select id="t-dep"><option value="">None</option></select>
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
        <button class="btn" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>

  <!-- ADD/EDIT SUBTASK MODAL -->
  <div class="modal-overlay" id="subtask-modal">
    <div class="modal">
      <h2 style="font-size: 1.1rem; margin-bottom: 14px; font-family: var(--font-mono);" id="submodal-title">Add Subtask</h2>
      <input type="hidden" id="sub-parent-task-id">
      <input type="hidden" id="sub-edit-id">
      
      <div class="space-y">
        <input type="text" id="sub-title" placeholder="Subtask Title">
        <textarea id="sub-desc" placeholder="Description (optional)" rows="2"></textarea>
        <div>
          <label style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-bottom: 4px;">TAGS (comma separated):</label>
          <input type="text" id="sub-tags" placeholder="e.g. review, fix">
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('subtask-modal')">Cancel</button>
        <button class="btn" onclick="saveSubtask()">Save Subtask</button>
      </div>
    </div>
  </div>

  <!-- CONFIGURE LIMITS MODAL -->
  <div class="modal-overlay" id="limit-modal">
    <div class="modal">
      <h2 style="font-size: 1.1rem; margin-bottom: 14px; font-family: var(--font-mono);">Set Project Time Limit</h2>
      <div class="space-y">
        <input type="text" id="p-name" placeholder="Project Name">
        <input type="number" id="p-limit" placeholder="Target Hours Limit">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('limit-modal')">Cancel</button>
        <button class="btn" onclick="saveProjectLimit()">Save Limit</button>
      </div>
    </div>
  </div>

  <script>
    let appData = JSON.parse(localStorage.getItem('claude_pwa_todo_v2')) || {
      tasks: [],
      projectLimits: {},
      projectColors: {},
      tagColors: {}
    };

    let selectedFilterTags = new Set();
    let activeTimer = null;

    function saveData() {
      localStorage.setItem('claude_pwa_todo_v2', JSON.stringify(appData));
    }

    const PRESET_COLORS = ['#fee2e2', '#fef3c7', '#dcfce7', '#e0e7ff', '#f3e8ff', '#fce7f3'];
    function getRandomColor() {
      return PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)];
    }

    function switchTab(tab, element) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
      
      const targets = document.querySelectorAll(`[onclick*="'${tab}'"]`);
      targets.forEach(t => t.classList.add('active'));

      document.getElementById(`sec-${tab}`).classList.add('active');

      if (tab === 'graph') renderGraph();
      if (tab === 'reports') renderReports();
    }

    /* --- TASK MODAL --- */
    function openTaskModal(taskId = null) {
      const depSelect = document.getElementById('t-dep');
      depSelect.innerHTML = '<option value="">None</option>';
      
      appData.tasks.forEach(t => {
        if (t.id !== taskId) {
          depSelect.innerHTML += `<option value="${t.id}">${t.title}</option>`;
        }
      });

      if (taskId) {
        const task = appData.tasks.find(t => t.id === taskId);
        document.getElementById('modal-title').innerText = 'Edit Task';
        document.getElementById('edit-task-id').value = task.id;
        document.getElementById('t-title').value = task.title;
        document.getElementById('t-desc').value = task.description || '';
        document.getElementById('t-project').value = task.project || '';
        document.getElementById('t-project-color').value = appData.projectColors[task.project] || '#e2e8f0';
        document.getElementById('t-tags').value = task.tags ? task.tags.join(', ') : '';
        document.getElementById('t-dep').value = task.dependsOn || '';
      } else {
        document.getElementById('modal-title').innerText = 'Create Task';
        document.getElementById('edit-task-id').value = '';
        document.getElementById('t-title').value = '';
        document.getElementById('t-desc').value = '';
        document.getElementById('t-project').value = '';
        document.getElementById('t-tags').value = '';
        document.getElementById('t-dep').value = '';
      }

      document.getElementById('task-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function saveTask() {
      const title = document.getElementById('t-title').value.trim();
      if (!title) return;

      const editId = document.getElementById('edit-task-id').value;
      const project = document.getElementById('t-project').value.trim();
      const projColor = document.getElementById('t-project-color').value;
      const tags = document.getElementById('t-tags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
      const dependsOn = document.getElementById('t-dep').value;

      if (project) {
        appData.projectColors[project] = projColor;
      }

      tags.forEach(tag => {
        if (!appData.tagColors[tag]) {
          appData.tagColors[tag] = getRandomColor();
        }
      });

      if (editId) {
        const task = appData.tasks.find(t => t.id === editId);
        if (task) {
          task.title = title;
          task.description = document.getElementById('t-desc').value;
          task.project = project;
          task.tags = tags;
          task.dependsOn = dependsOn || null;
        }
      } else {
        appData.tasks.push({
          id: 'task_' + Date.now(),
          title,
          description: document.getElementById('t-desc').value,
          project,
          tags,
          dependsOn: dependsOn || null,
          completed: false,
          subtasks: [],
          timeSpent: 0
        });
      }

      saveData();
      closeModal('task-modal');
      renderTagFilters();
      renderTasks();
    }

    function toggleTaskComplete(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        saveData();
        renderTasks();
      }
    }

    function deleteTask(id) {
      appData.tasks = appData.tasks.filter(t => t.id !== id);
      saveData();
      renderTagFilters();
      renderTasks();
    }

    /* --- RICH SUBTASK MODAL --- */
    function openSubtaskModal(parentTaskId, subId = null) {
      document.getElementById('sub-parent-task-id').value = parentTaskId;
      document.getElementById('sub-edit-id').value = subId || '';

      if (subId) {
        const task = appData.tasks.find(t => t.id === parentTaskId);
        const sub = task ? task.subtasks.find(s => s.id === subId) : null;
        if (sub) {
          document.getElementById('submodal-title').innerText = 'Edit Subtask';
          document.getElementById('sub-title').value = sub.title;
          document.getElementById('sub-desc').value = sub.description || '';
          document.getElementById('sub-tags').value = sub.tags ? sub.tags.join(', ') : '';
        }
      } else {
        document.getElementById('submodal-title').innerText = 'Add Subtask';
        document.getElementById('sub-title').value = '';
        document.getElementById('sub-desc').value = '';
        document.getElementById('sub-tags').value = '';
      }

      document.getElementById('subtask-modal').style.display = 'flex';
    }

    function saveSubtask() {
      const parentTaskId = document.getElementById('sub-parent-task-id').value;
      const subId = document.getElementById('sub-edit-id').value;
      const title = document.getElementById('sub-title').value.trim();
      
      if (!title) return;

      const desc = document.getElementById('sub-desc').value;
      const tags = document.getElementById('sub-tags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);

      tags.forEach(tag => {
        if (!appData.tagColors[tag]) {
          appData.tagColors[tag] = getRandomColor();
        }
      });

      const task = appData.tasks.find(t => t.id === parentTaskId);
      if (task) {
        if (subId) {
          const sub = task.subtasks.find(s => s.id === subId);
          if (sub) {
            sub.title = title;
            sub.description = desc;
            sub.tags = tags;
          }
        } else {
          task.subtasks.push({
            id: 'sub_' + Date.now(),
            title,
            description: desc,
            tags,
            completed: false
          });
        }
        saveData();
        closeModal('subtask-modal');
        renderTagFilters();
        renderTasks();
      }
    }

    function toggleSubtask(taskId, subId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        const sub = task.subtasks.find(s => s.id === subId);
        if (sub) sub.completed = !sub.completed;
        saveData();
        renderTasks();
      }
    }

    function deleteSubtask(taskId, subId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.subtasks = task.subtasks.filter(s => s.id !== subId);
        saveData();
        renderTasks();
      }
    }

    /* --- APPLE LOCKSCREEN MEDIA SESSION --- */
    function updateLockScreenMedia(taskTitle, formattedTime) {
      if ('mediaSession' in navigator) {
        const audio = document.getElementById('silent-audio');
        if (audio.paused) {
          audio.play().catch(() => {});
        }

        navigator.mediaSession.metadata = new MediaMetadata({
          title: taskTitle,
          artist: `Time Tracked: ${formattedTime}`,
          album: "Workspace Focus Timer"
        });

        navigator.mediaSession.setActionHandler('pause', () => {
          if (activeTimer) toggleTimer(activeTimer.taskId);
        });
      }
    }

    function stopLockScreenMedia() {
      if ('mediaSession' in navigator) {
        const audio = document.getElementById('silent-audio');
        audio.pause();
      }
    }

    function toggleTimer(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);

      if (activeTimer && activeTimer.taskId === taskId) {
        clearInterval(activeTimer.timerId);
        const elapsed = Math.floor((Date.now() - activeTimer.startTime) / 1000);
        if (task) task.timeSpent += elapsed;
        activeTimer = null;
        stopLockScreenMedia();
        saveData();
        renderTasks();
      } else {
        if (activeTimer) toggleTimer(activeTimer.taskId);
        
        activeTimer = {
          taskId,
          startTime: Date.now(),
          timerId: setInterval(() => updateTimerDisplay(taskId), 1000)
        };
        
        if (task) {
          updateLockScreenMedia(task.title, formatTime(task.timeSpent));
        }
        renderTasks();
      }
    }

    function updateTimerDisplay(taskId) {
      const el = document.getElementById(`timer-val-${taskId}`);
      if (el && activeTimer) {
        const currentElapsed = Math.floor((Date.now() - activeTimer.startTime) / 1000);
        const task = appData.tasks.find(t => t.id === taskId);
        const total = (task ? task.timeSpent : 0) + currentElapsed;
        const formatted = formatTime(total);
        
        el.innerText = formatted;
        
        if (task) {
          updateLockScreenMedia(task.title, formatted);
        }
      }
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h > 0 ? h + 'h ' : ''}${m}m ${s}s`;
    }

    /* --- RENDER TASKS & TAGS --- */
    function renderTagFilters() {
      const container = document.getElementById('tag-filters');
      container.innerHTML = '';
      
      const allTags = new Set();
      appData.tasks.forEach(t => {
        (t.tags || []).forEach(tag => allTags.add(tag));
        (t.subtasks || []).forEach(sub => (sub.tags || []).forEach(tag => allTags.add(tag)));
      });

      allTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = `filter-chip ${selectedFilterTags.has(tag) ? 'active' : ''}`;
        chip.innerText = `#${tag}`;
        chip.onclick = () => {
          if (selectedFilterTags.has(tag)) selectedFilterTags.delete(tag);
          else selectedFilterTags.add(tag);
          renderTagFilters();
          renderTasks();
        };
        container.appendChild(chip);
      });
    }

    function renderTasks() {
      const container = document.getElementById('task-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      let filtered = appData.tasks.filter(task => {
        const matchesSearch = task.title.toLowerCase().includes(searchQuery);
        const matchesTags = selectedFilterTags.size === 0 || 
          Array.from(selectedFilterTags).every(t => (task.tags || []).includes(t));
        return matchesSearch && matchesTags;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0; font-family: var(--font-mono);">No matching tasks found.</div>`;
        return;
      }

      filtered.forEach(task => {
        const totalSub = task.subtasks.length;
        const doneSub = task.subtasks.filter(s => s.completed).length;
        const progressPct = totalSub === 0 ? 0 : Math.round((doneSub / totalSub) * 100);
        const isRunning = activeTimer && activeTimer.taskId === task.id;

        const projColor = appData.projectColors[task.project] || '#e2e8f0';

        const card = document.createElement('div');
        card.className = `task-card ${task.completed ? 'completed' : ''}`;
        card.innerHTML = `
          <div class="task-header">
            <div class="task-title">
              <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskComplete('${task.id}')" style="width: 18px; height: 18px; cursor: pointer; flex-shrink: 0;">
              <span>${task.title}</span>
            </div>
            <div class="flex-gap" style="flex-shrink: 0;">
              <button class="btn btn-secondary btn-sm" onclick="openTaskModal('${task.id}')">Edit</button>
              <button class="btn btn-secondary btn-sm" onclick="deleteTask('${task.id}')">Delete</button>
            </div>
          </div>

          ${task.description ? `<div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px;">${task.description}</div>` : ''}

          <div class="task-meta">
            ${task.project ? `<span class="pill" style="background:${projColor}; color:#1e293b;">${task.project}</span>` : ''}
            ${(task.tags || []).map(t => `<span class="pill pill-tag" style="background:${appData.tagColors[t] || '#f1f5f9'};">#${t}</span>`).join('')}
          </div>

          <div style="font-size: 0.72rem; color: var(--text-muted); display: flex; justify-content: space-between; font-family: var(--font-mono);">
            <span>Progress</span>
            <span>${doneSub}/${totalSub} (${progressPct}%)</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${progressPct}%"></div></div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
            <div class="timer-badge">
              <span id="timer-val-${task.id}">${formatTime(task.timeSpent)}</span>
            </div>
            <button class="btn btn-sm ${isRunning ? 'btn-secondary' : ''}" onclick="toggleTimer('${task.id}')">
              ${isRunning ? 'Pause' : 'Start Timer'}
            </button>
          </div>

          <!-- SUBTASKS CONTAINER -->
          <div class="subtask-tree">
            ${task.subtasks.map(sub => `
              <div class="subtask-card ${sub.completed ? 'completed' : ''}">
                <div class="subtask-header">
                  <div class="subtask-main">
                    <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubtask('${task.id}', '${sub.id}')" style="cursor: pointer; flex-shrink: 0;">
                    <span class="sub-title">${sub.title}</span>
                  </div>
                  <div class="flex-gap">
                    <button class="btn btn-secondary btn-sm" style="padding: 2px 6px; font-size: 0.7rem;" onclick="openSubtaskModal('${task.id}', '${sub.id}')">Edit</button>
                    <button class="btn btn-secondary btn-sm" style="padding: 2px 6px; font-size: 0.7rem;" onclick="deleteSubtask('${task.id}', '${sub.id}')">✕</button>
                  </div>
                </div>

                ${sub.description ? `<div class="sub-desc">${sub.description}</div>` : ''}

                ${(sub.tags && sub.tags.length > 0) ? `
                  <div style="display:flex; gap:4px; margin-left:26px; margin-top:4px; flex-wrap:wrap;">
                    ${sub.tags.map(st => `<span class="pill pill-tag" style="background:${appData.tagColors[st] || '#f1f5f9'}; font-size: 0.65rem; padding: 1px 6px;">#${st}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            `).join('')}
            
            <button class="btn btn-secondary btn-sm" style="align-self: flex-start; margin-top: 4px;" onclick="openSubtaskModal('${task.id}')">
              + Add Subtask
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* --- DEPENDENCY GRAPH & REPORTS --- */
    function renderGraph() {
      const canvas = document.getElementById('graph-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth - 64;
      canvas.height = 400;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (appData.tasks.length === 0) return;

      const nodes = appData.tasks.map((t, i) => ({
        ...t,
        x: 80 + (i % 2) * (canvas.width - 160),
        y: 60 + Math.floor(i / 2) * 90
      }));

      nodes.forEach(node => {
        if (node.dependsOn) {
          const target = nodes.find(n => n.id === node.dependsOn);
          if (target) {
            ctx.beginPath();
            ctx.moveTo(target.x, target.y);
            ctx.lineTo(node.x, node.y);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }
      });

      nodes.forEach(node => {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(node.x - 60, node.y - 20, 120, 40, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = '11px Space Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(node.title.length > 12 ? node.title.slice(0, 10) + '...' : node.title, node.x, node.y + 4);
      });
    }

    function openProjectLimitModal() {
      document.getElementById('p-name').value = '';
      document.getElementById('p-limit').value = '';
      document.getElementById('limit-modal').style.display = 'flex';
    }

    function saveProjectLimit() {
      const name = document.getElementById('p-name').value.trim();
      const limit = parseFloat(document.getElementById('p-limit').value);
      if (name && !isNaN(limit)) {
        appData.projectLimits[name] = limit;
        saveData();
        closeModal('limit-modal');
        renderReports();
      }
    }

    function renderReports() {
      const container = document.getElementById('report-container');
      container.innerHTML = '';

      const projectTimes = {};
      appData.tasks.forEach(task => {
        if (task.project) {
          projectTimes[task.project] = (projectTimes[task.project] || 0) + task.timeSpent;
        }
      });

      const allProjects = new Set([...Object.keys(projectTimes), ...Object.keys(appData.projectLimits)]);

      if (allProjects.size === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); font-family: var(--font-mono);">No project time tracked yet.</div>`;
        return;
      }

      allProjects.forEach(proj => {
        const spentSec = projectTimes[proj] || 0;
        const spentHours = (spentSec / 3600).toFixed(2);
        const limitHours = appData.projectLimits[proj] || null;

        let statusText = `${spentHours} hrs spent`;
        let pct = 0;

        if (limitHours) {
          pct = Math.min(Math.round((spentHours / limitHours) * 100), 100);
          statusText += ` of ${limitHours} hrs limit (${pct}%)`;
        }

        const card = document.createElement('div');
        card.className = 'report-card';
        card.innerHTML = `
          <div style="font-weight: 700; font-family: var(--font-mono); font-size: 1rem; margin-bottom: 6px;">${proj}</div>
          <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px;">${statusText}</div>
          ${limitHours ? `
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${pct}%; background: ${pct >= 100 ? '#ef4444' : 'var(--text)'};"></div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    /* --- PWA SETUP --- */
    const manifestBlob = new Blob([JSON.stringify({
      name: "Minimal Task Workspace",
      short_name: "Tasks",
      start_url: "./",
      display: "standalone",
      background_color: "#ffffff",
      theme_color: "#18181b",
      icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/></svg>", sizes: "192x192 512x512", type: "image/svg+xml" }]
    })], { type: 'application/json' });
    document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'todo-pwa-v5';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }

    renderTagFilters();
    renderTasks();
  </script>
</body>
</html>
